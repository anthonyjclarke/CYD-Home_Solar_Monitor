# Copy to .github/workflows/firmware.yml in a CYD project. Builds every board
# on each push and PR; a v* tag on main publishes the release and installer.
name: Firmware
on:
  push: { branches: [dev, main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  model-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      # Install only the pinned JSON headers for the real-handler/config checks.
      - run: |
          python -m pip install platformio==6.2.0
          mkdir -p .pio/libdeps/cyd28
          pio pkg install --global --library 'bblanchon/ArduinoJson@7.4.2' --storage-dir .pio/libdeps/cyd28
      - run: python3 tools/check_host.py
      - run: python3 tools/check_docs.py
      - run: node tests/test_web_history.js
      - run: node tests/test_web_settings.js
      - run: node tests/test_web_dashboard.js
  firmware:
    needs: model-checks
    uses: anthonyjclarke/cyd-web-installer/.github/workflows/cyd-release.yml@main
    permissions: { contents: write, pages: write, id-token: write }
