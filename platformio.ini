[platformio]
default_envs = cyd28

; Shared by every board. Pins, driver and geometry live in include/config.h,
; selected by each env's BOARD_* flag (none = classic 2.8-inch). Keep `cyd28`
; as the reference env: the host tools read its .pio/libdeps directory.
[common]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_custom.csv
extra_scripts =
    pre:tools/embed_docs.py
    post:tools/merge_bin.py
    post:tools/flash_budget.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    tzapu/WiFiManager@2.0.17
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -include include/config.h

[env:cyd28]
extends = common
custom_installer_label = CYD 2.8″ – ESP32-2432S028R
custom_installer_hint = Home Assistant solar, grid and battery energy-flow display.

; Same ILI9341 panel, pins and own-bus touch as the 2.8″; only the name differs.
[env:cyd24]
extends = common
custom_installer_label = CYD 2.4″ – ESP32-2432S024R
custom_installer_hint = 2.4″ resistive-touch CYD. Capacitive (C) boards display but do not respond to taps.
build_flags =
    ${common.build_flags}
    -DBOARD_CYD24=1

; ESP32-32E 2.8″ with USB-C, speaker and battery ports (LCDwiki E32R28T,
; sold by Freenove as FNK0114B with an ST7789 TN panel).
[env:e32r28t-st7789]
extends = common
custom_installer_label = 2.8″ ESP32-32E ST7789 – Freenove FNK0114B
custom_installer_hint = USB-C 2.8″ board with speaker and battery ports, ST7789 panel.
build_flags =
    ${common.build_flags}
    -DBOARD_E32R28T_ST7789=1

; The same ESP32-32E 2.8″ board with an ILI9341 panel (Freenove FNK0114F).
[env:e32r28t-ili9341]
extends = common
custom_installer_label = 2.8″ ESP32-32E ILI9341 – Freenove FNK0114F
custom_installer_hint = USB-C 2.8″ board with speaker and battery ports, ILI9341 panel.
build_flags =
    ${common.build_flags}
    -DBOARD_E32R28T_ILI9341=1

; ESP32-32E 4.0″ ST7796S 480×320 (LCDwiki E32R40T / Freenove FNK0114S).
; Native 480×320 layout drawn in two bands; touch shares the display's SPI bus.
[env:cyd40]
extends = common
custom_installer_label = CYD 4.0″ – ESP32-32E ST7796
custom_installer_hint = 4.0″ 480×320 screen with its own full-screen layout.
build_flags =
    ${common.build_flags}
    -DBOARD_CYD40=1
