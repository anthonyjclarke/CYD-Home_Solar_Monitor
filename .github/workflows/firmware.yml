# Copy to .github/workflows/firmware.yml in a CYD project. Builds every board
# on each push and PR; a v* tag on main publishes the release and installer.
name: Firmware
on:
  push: { branches: [dev, main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  model-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_host.py
  firmware:
    needs: model-checks
    uses: anthonyjclarke/cyd-web-installer/.github/workflows/cyd-release.yml@main
    permissions: { contents: write, pages: write, id-token: write }
